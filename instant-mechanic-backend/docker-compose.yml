services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  api:
    build: .
    restart: unless-stopped
    ports: ["5000:5000"]
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/instant-mechanic
      JWT_SECRET: change_this_to_a_long_random_secret
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: info
    depends_on: [mongo]
volumes:
  mongo_data:
